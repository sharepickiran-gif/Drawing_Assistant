<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div>
            <h1>Drawing Assistant</h1>
            <p>A smarter way to construct portraits</p>
        </div>
    </header>

    <main class="app-container">
        <section class="upload-section">
            <h2>01 — Upload your reference</h2>
            <p>Select a portrait photograph to begin.</p>

            <div class="grid-settings">
                <label for="gridMode">Grid type</label>
                <select id="gridMode">
                    <option value="regular" selected>Regular grid</option>
                    <option value="custom">Custom grid</option>
                </select>

                <div id="regularGridSettings" class="regular-grid-settings">
                    <label for="gridColor">Grid color</label>
                    <input id="gridColor" type="color" value="#e53935">
                    <label for="gridSizeInput">Square size (cm)</label>
                    <input
                        id="gridSizeInput"
                        type="number"
                        min="0.1"
                        max="100"
                        step="0.1"
                        value="2"
                        inputmode="decimal"
                    >
                    <span id="gridSizeStatus" aria-live="polite">2 cm squares</span>
                    <button
                        id="halfGridButton"
                        class="half-grid-button"
                        type="button"
                        aria-pressed="false"
                    >
                        Half grids
                    </button>
                </div>
            </div>

            <div class="image-actions">
                <label for="imageUpload" class="upload-button">
                    Choose Photograph
                </label>

                <button id="downloadImage" class="download-button" type="button" disabled>
                    Download Image
                </button>
            </div>

            <input
                type="file"
                id="imageUpload"
                accept="image/*"
                hidden
            >
        </section>

        <section class="workspace">
            <div class="workspace-header">
                <h2>Reference Workspace</h2>
                <span id="imageStatus">No image loaded</span>
            </div>

            <div class="paper-settings">
    <label for="paperSize">Paper size</label>
    <select id="paperSize">
        <option value="A5">A5</option>
        <option value="A4" selected>A4</option>
        <option value="A3">A3</option>
    </select>

    <label for="paperOrientation">Orientation</label>
    <select id="paperOrientation">
        <option value="portrait" selected>Portrait</option>
        <option value="landscape">Landscape</option>
    </select>
</div>

<div id="imageContainer" class="image-container">
    <div id="placeholder" class="placeholder">
        <span class="placeholder-icon">＋</span>
        <p>Your portrait will appear here</p>
        <small>Upload an image to get started</small>
    </div>

    <div id="paperWorkspace" class="paper-workspace" hidden>
        <div id="topRuler" class="ruler ruler-horizontal"></div>

        <div class="paper-middle">
            <div id="leftRuler" class="ruler ruler-vertical"></div>

            <div id="paperStage" class="paper-stage">
                <img id="referenceImage" alt="Uploaded portrait reference">
                <canvas id="drawingCanvas"></canvas>
            </div>

            <div id="rightRuler" class="ruler ruler-vertical"></div>
        </div>

        <div id="bottomRuler" class="ruler ruler-horizontal"></div>
    </div>
</div>

            <div id="drawingInstructions" class="drawing-instructions" hidden>
                Upload a portrait, then click the centre of each eye.
            </div>

            <div id="drawingControls" class="drawing-controls" hidden>
                <button id="undoAction" type="button" disabled>
                    Undo
                </button>

                <button id="addHorizontalLine" type="button" disabled>
                    Red line
                </button>

                <button id="addVerticalLine" type="button" disabled>
                    Blue line
                </button>

                <button id="addRandomLine" type="button" disabled>
                    Random line
                </button>

                <button id="resetLine" type="button" disabled>
                    Reset guides
                </button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
